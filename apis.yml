description: >-
  The US African Development Foundation (USADF) is an independent federal agency established by Congress in 1980 to
  invest directly in African grassroots enterprises and social entrepreneurs. USADF provides grant capital of up to
  $250,000, capacity-building assistance, and convening opportunities to develop, grow, and scale African enterprises
  and entrepreneurs. USADF grant data is publicly accessible via the USASpending.gov API, and grant opportunities are
  posted to Grants.gov. Between 2019 and 2023, USADF awarded more than $141 million in grants to over 1,050 community
  enterprises in Africa, directly affecting 6.2 million people.
